<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1769AA"
  >

  <title>Wellens Healthcare</title>


  <!-- =======================================================
       FAVICON
       Uses your Wellens logo
       ======================================================= -->

  <link
    rel="icon"
    type="image/png"
    href="./wellens-logo.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="./wellens-logo.png"
  >

  <link
    rel="apple-touch-icon"
    href="./wellens-logo.png"
  >


  <style>

    /* =========================================================
       WELLENS BRAND PALETTE
       ========================================================= */

    :root {

      --primary-blue: #1769AA;
      --primary-dark: #125486;

      --teal: #0F9D8A;
      --light-teal: #E8F5F2;

      --background: #F7FAFC;
      --white: #FFFFFF;

      --text: #1F2937;
      --muted: #64748B;

      --border: #E2E8F0;

      --hero-blue: #DCEEF9;
      --hero-teal: #DFF5F1;

      --cta-blue: #0D82A1;

      --footer: #102A43;
      --footer-text: #B8C7D6;

      /* ECG */
      --ecg-red: #C62828;
      --ecg-light: #E57373;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 50% 36%,
          rgba(220, 238, 249, 0.95),
          transparent 35%
        ),

        radial-gradient(
          circle at 15% 90%,
          rgba(223, 245, 241, 0.72),
          transparent 30%
        ),

        var(--background);

      overflow: hidden;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .page {

      min-height: 100vh;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        55px 24px 65px;

      text-align: center;
    }


    /* =========================================================
       WELLENS LOGO
       ========================================================= */

    .brand {

      position: absolute;

      top: 23px;
      left: 35px;

      display: flex;

      align-items: center;

      animation:
        fadeDown 0.9s ease both;
    }


    .brand-logo {

      /*
        Your actual Wellens logo.
      */

      width: 115px;
      height: 75px;

      object-fit: contain;

      display: block;
    }


    /* =========================================================
       CENTRAL VISUAL
       ========================================================= */

    .visual {

      width: 520px;
      height: 315px;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 4px;

      transition:
        transform 0.15s ease-out;
    }


    /* =========================================================
       BACKGROUND HALO
       ========================================================= */

    .halo {

      position: absolute;

      width: 285px;
      height: 285px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(220, 238, 249, 0.90),
          rgba(223, 245, 241, 0.42) 58%,
          transparent 72%
        );

      animation:
        breathe 6s ease-in-out infinite;
    }


    /* =========================================================
       SUBTLE ORBIT
       ========================================================= */

    .orbit {

      position: absolute;

      width: 275px;
      height: 275px;

      border-radius: 50%;

      border:
        1px solid
        rgba(23, 105, 170, 0.10);

      animation:
        rotate 24s linear infinite;
    }


    .orbit::before,
    .orbit::after {

      content: "";

      position: absolute;

      width: 6px;
      height: 6px;

      border-radius: 50%;
    }


    .orbit::before {

      top: 18px;

      left: 50%;

      transform:
        translateX(-50%);

      background:
        var(--primary-blue);
    }


    .orbit::after {

      right: 25px;

      bottom: 43px;

      background:
        var(--teal);
    }


    /* =========================================================
       BUILDING CONSTRUCTION SCENE
       ========================================================= */

    .construction {

      position: relative;

      width: 300px;
      height: 245px;

      z-index: 4;

      animation:
        constructionFloat
        6s
        ease-in-out
        infinite;
    }


    /* =========================================================
       GROUND / FOUNDATION
       ========================================================= */

    .ground {

      position: absolute;

      left: 50%;

      bottom: 15px;

      width: 220px;
      height: 7px;

      transform:
        translateX(-50%);

      border-radius: 10px;

      background:
        var(--primary-blue);

      opacity: 0.18;
    }


    .foundation {

      position: absolute;

      left: 50%;

      bottom: 22px;

      width: 125px;
      height: 15px;

      transform:
        translateX(-50%);

      border-radius:
        3px 3px 5px 5px;

      background:
        var(--primary-dark);

      box-shadow:
        0 7px 15px
        rgba(18, 84, 134, 0.12);
    }


    /* =========================================================
       BUILDING BODY
       ========================================================= */

    .building {

      position: absolute;

      left: 50%;

      bottom: 37px;

      width: 125px;
      height: 160px;

      transform:
        translateX(-50%);

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      gap: 4px;
    }


    /* =========================================================
       BUILDING FLOORS
       ========================================================= */

    .floor {

      width: 100%;
      height: 37px;

      position: relative;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      padding:
        6px 8px;

      background:
        linear-gradient(
          135deg,
          #FFFFFF,
          #EEF7FB
        );

      border:
        1px solid
        rgba(23, 105, 170, 0.17);

      border-radius: 3px;

      box-shadow:
        0 4px 10px
        rgba(23, 105, 170, 0.07);

      transform-origin:
        bottom center;
    }


    /* Building floors are constructed sequentially */

    .floor-one {

      animation:
        floorBuild
        6s
        0.3s
        ease-in-out
        infinite;
    }


    .floor-two {

      animation:
        floorBuild
        6s
        0.8s
        ease-in-out
        infinite;
    }


    .floor-three {

      animation:
        floorBuild
        6s
        1.3s
        ease-in-out
        infinite;
    }


    .floor-four {

      animation:
        floorBuild
        6s
        1.8s
        ease-in-out
        infinite;
    }


    /* =========================================================
       WINDOWS
       ========================================================= */

    .window {

      display: block;

      border-radius: 2px;

      background:
        var(--hero-blue);

      border:
        1px solid
        rgba(23, 105, 170, 0.13);

      transition:
        background 0.3s ease;
    }


    .floor-four .window {

      animation:
        windowLight
        6s
        3s
        ease-in-out
        infinite;
    }


    .floor-three .window {

      animation:
        windowLight
        6s
        3.3s
        ease-in-out
        infinite;
    }


    .floor-two .window {

      animation:
        windowLight
        6s
        3.6s
        ease-in-out
        infinite;
    }


    .floor-one .window {

      animation:
        windowLight
        6s
        3.9s
        ease-in-out
        infinite;
    }


    /* =========================================================
       CRANE
       ========================================================= */

    .crane {

      position: absolute;

      left: 16px;
      top: 13px;

      width: 185px;
      height: 190px;

      z-index: 8;
    }


    /* Crane mast */

    .crane-mast {

      position: absolute;

      left: 18px;
      top: 0;

      width: 6px;
      height: 190px;

      border-radius: 4px;

      background:
        var(--primary-blue);
    }


    /* Mast diagonal supports */

    .crane-mast::before,
    .crane-mast::after {

      content: "";

      position: absolute;

      width: 4px;
      height: 175px;

      top: 10px;

      background:
        var(--primary-blue);

      transform-origin:
        top center;

      opacity: 0.65;
    }


    .crane-mast::before {

      left: 0;

      transform:
        rotate(12deg);
    }


    .crane-mast::after {

      left: 2px;

      transform:
        rotate(-12deg);
    }


    /* Crane horizontal arm */

    .crane-arm {

      position: absolute;

      left: 19px;
      top: 4px;

      width: 165px;
      height: 6px;

      border-radius: 5px;

      background:
        var(--primary-blue);

      transform-origin:
        left center;

      animation:
        craneArmMove
        6s
        ease-in-out
        infinite;
    }


    /* Crane counterweight */

    .counterweight {

      position: absolute;

      left: -8px;
      top: -4px;

      width: 25px;
      height: 14px;

      border-radius: 3px;

      background:
        var(--primary-dark);
    }


    /* =========================================================
       CRANE CABLE
       ========================================================= */

    .cable {

      position: absolute;

      right: 22px;
      top: 7px;

      width: 2px;
      height: 68px;

      background:
        var(--muted);

      transform-origin:
        top center;

      animation:
        cableLength
        6s
        ease-in-out
        infinite;
    }


    /* =========================================================
       HOOK
       ========================================================= */

    .hook {

      position: absolute;

      right: 16px;
      top: 72px;

      width: 15px;
      height: 16px;

      border:
        2px solid
        var(--primary-blue);

      border-top:
        none;

      border-radius:
        0 0 10px 10px;

      animation:
        hookMove
        6s
        ease-in-out
        infinite;
    }


    /* =========================================================
       PANEL BEING INSTALLED
       ========================================================= */

    .building-panel {

      position: absolute;

      width: 29px;
      height: 35px;

      right: 29px;
      top: 76px;

      border-radius: 3px;

      background:
        linear-gradient(
          135deg,
          var(--teal),
          #0B8D7D
        );

      border:
        2px solid
        rgba(255,255,255,0.65);

      box-shadow:
        0 7px 16px
        rgba(15,157,138,0.22);

      z-index: 9;

      animation:
        panelBuild
        6s
        ease-in-out
        infinite;
    }


    /* Panel has a small window */

    .building-panel::after {

      content: "";

      position: absolute;

      left: 7px;
      top: 7px;

      width: 11px;
      height: 13px;

      border-radius: 2px;

      background:
        rgba(255,255,255,0.72);
    }


    /* =========================================================
       SMALL BLUEPRINT
       ========================================================= */

    .blueprint {

      position: absolute;

      left: 2px;
      bottom: 29px;

      width: 46px;
      height: 33px;

      border:
        1px solid
        rgba(23,105,170,0.22);

      border-radius: 3px;

      background:
        rgba(255,255,255,0.55);

      transform:
        rotate(-5deg);

      opacity: 0.8;
    }


    .blueprint::before,
    .blueprint::after {

      content: "";

      position: absolute;

      background:
        var(--primary-blue);

      opacity: 0.25;
    }


    .blueprint::before {

      width: 28px;
      height: 1px;

      left: 8px;
      top: 10px;
    }


    .blueprint::after {

      width: 18px;
      height: 1px;

      left: 8px;
      top: 19px;
    }


    /* =========================================================
       ECG AREA
       ========================================================= */

    .heartbeat {

      position: absolute;

      width: 500px;
      height: 105px;

      left: 50%;

      bottom: -7px;

      transform:
        translateX(-50%);

      z-index: 12;

      pointer-events: none;
    }


    .heartbeat svg {

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* ---------------------------------------------------------
       STATIC ECG TRACE
       --------------------------------------------------------- */

    .ecg-base {

      fill: none;

      stroke:
        rgba(198, 40, 40, 0.23);

      stroke-width: 1.5;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* ---------------------------------------------------------
       MOVING ECG PULSE
       --------------------------------------------------------- */

    .ecg-pulse {

      fill: none;

      stroke:
        var(--ecg-red);

      stroke-width: 2.6;

      stroke-linecap: round;

      stroke-linejoin: round;

      /*
        IMPORTANT:
        The whole rhythm remains visible.
        Only a small highlight travels along it.
      */

      stroke-dasharray:
        55 645;

      stroke-dashoffset:
        700;

      filter:
        drop-shadow(
          0 0 4px
          rgba(198,40,40,0.35)
        );

      animation:
        ecgTravel
        5s
        linear
        infinite;
    }


    /* =========================================================
       TEXT
       ========================================================= */

    .eyebrow {

      margin-bottom: 15px;

      color:
        var(--primary-blue);

      font-size: 11px;

      font-weight: 750;

      letter-spacing: 2px;

      text-transform: uppercase;

      animation:
        fadeUp
        0.9s
        0.7s
        ease
        both;
    }


    h1 {

      font-size:
        clamp(44px, 6vw, 70px);

      line-height: 1;

      letter-spacing:
        -3.5px;

      font-weight:
        650;

      color:
        var(--text);

      margin-bottom:
        20px;

      animation:
        fadeUp
        0.9s
        0.85s
        ease
        both;
    }


    h1 span {

      color:
        var(--primary-blue);
    }


    .description {

      max-width:
        500px;

      margin:
        0 auto;

      color:
        var(--muted);

      font-size:
        15px;

      line-height:
        1.8;

      animation:
        fadeUp
        0.9s
        1s
        ease
        both;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {

      margin-top:
        25px;

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        9px 16px;

      border-radius:
        100px;

      background:
        var(--light-teal);

      border:
        1px solid
        rgba(15,157,138,0.12);

      color:
        #087967;

      font-size:
        11px;

      font-weight:
        650;

      animation:
        fadeUp
        0.9s
        1.15s
        ease
        both;
    }


    .status-dot {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        var(--teal);

      animation:
        statusPulse
        2s
        infinite;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      position:
        absolute;

      bottom:
        0;

      left:
        0;

      right:
        0;

      height:
        42px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        var(--footer);

      color:
        var(--footer-text);

      font-size:
        10px;

      animation:
        fadeUp
        1s
        1.4s
        ease
        both;
    }


    /* =========================================================
       ANIMATIONS
       ========================================================= */


    /* ---------------------------------------------------------
       HALO
       --------------------------------------------------------- */

    @keyframes breathe {

      0%,
      100% {

        transform:
          scale(0.96);

        opacity:
          0.70;
      }

      50% {

        transform:
          scale(1.05);

        opacity:
          1;
      }
    }


    /* ---------------------------------------------------------
       ORBIT
       --------------------------------------------------------- */

    @keyframes rotate {

      from {

        transform:
          rotate(0deg);
      }

      to {

        transform:
          rotate(360deg);
      }
    }


    /* ---------------------------------------------------------
       CONSTRUCTION FLOAT
       --------------------------------------------------------- */

    @keyframes constructionFloat {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-5px);
      }
    }


    /* ---------------------------------------------------------
       CRANE ARM
       --------------------------------------------------------- */

    @keyframes craneArmMove {

      0%,
      100% {

        transform:
          rotate(0deg);
      }

      45% {

        transform:
          rotate(-2deg);
      }

      70% {

        transform:
          rotate(1deg);
      }
    }


    /* ---------------------------------------------------------
       CABLE
       --------------------------------------------------------- */

    @keyframes cableLength {

      0%,
      100% {

        height:
          68px;
      }

      38% {

        height:
          88px;
      }

      58% {

        height:
          82px;
      }
    }


    /* ---------------------------------------------------------
       HOOK
       --------------------------------------------------------- */

    @keyframes hookMove {

      0%,
      25% {

        transform:
          translateY(0);
      }

      42% {

        transform:
          translateY(18px);
      }

      58% {

        transform:
          translateY(13px);
      }

      75%,
      100% {

        transform:
          translateY(0);
      }
    }


    /* ---------------------------------------------------------
       BUILDING PANEL
       --------------------------------------------------------- */

    @keyframes panelBuild {

      /*
        Start away from building.
      */

      0% {

        transform:
          translate(0, 0);

        opacity:
          0;
      }


      15% {

        opacity:
          1;
      }


      /*
        Lift upward.
      */

      35% {

        transform:
          translate(0, -28px);
      }


      /*
        Move left toward the building.
      */

      52% {

        transform:
          translate(-70px, -28px);
      }


      /*
        Lower into position.
      */

      68% {

        transform:
          translate(-70px, 14px);
      }


      76% {

        transform:
          translate(-70px, 14px);

        opacity:
          1;
      }


      /*
        Reset and repeat.
      */

      88% {

        opacity:
          0;
      }


      100% {

        transform:
          translate(0, 0);

        opacity:
          0;
      }
    }


    /* ---------------------------------------------------------
       FLOOR CONSTRUCTION
       --------------------------------------------------------- */

    @keyframes floorBuild {

      0% {

        opacity:
          0.15;

        transform:
          translateY(12px)
          scaleY(0.8);
      }


      20% {

        opacity:
          0.35;
      }


      35%,
      82% {

        opacity:
          1;

        transform:
          translateY(0)
          scaleY(1);
      }


      100% {

        opacity:
          0.15;

        transform:
          translateY(12px)
          scaleY(0.8);
      }
    }


    /* ---------------------------------------------------------
       WINDOWS LIGHTING UP
       --------------------------------------------------------- */

    @keyframes windowLight {

      0%,
      45% {

        background:
          var(--hero-blue);
      }

      55%,
      78% {

        background:
          var(--hero-teal);
      }

      90%,
      100% {

        background:
          var(--hero-blue);
      }
    }


    /* ---------------------------------------------------------
       ECG
       --------------------------------------------------------- */

    @keyframes ecgTravel {

      0% {

        stroke-dashoffset:
          700;

        opacity:
          0.45;
      }


      10% {

        opacity:
          1;
      }


      70% {

        opacity:
          1;
      }


      100% {

        stroke-dashoffset:
          0;

        opacity:
          0.45;
      }
    }


    /* ---------------------------------------------------------
       STATUS PULSE
       --------------------------------------------------------- */

    @keyframes statusPulse {

      0%,
      100% {

        box-shadow:
          0 0 0 0
          rgba(15,157,138,0.25);
      }

      50% {

        box-shadow:
          0 0 0 6px
          rgba(15,157,138,0);
      }
    }


    /* ---------------------------------------------------------
       FADE UP
       --------------------------------------------------------- */

    @keyframes fadeUp {

      from {

        opacity:
          0;

        transform:
          translateY(15px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    /* ---------------------------------------------------------
       FADE DOWN
       --------------------------------------------------------- */

    @keyframes fadeDown {

      from {

        opacity:
          0;

        transform:
          translateY(-12px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      body {

        overflow:
          auto;
      }


      .page {

        min-height:
          100vh;

        padding:
          82px 18px 68px;
      }


      .brand {

        top:
          16px;

        left:
          18px;
      }


      .brand-logo {

        width:
          95px;

        height:
          62px;
      }


      .visual {

        width:
          340px;

        height:
          270px;

        margin-bottom:
          0;
      }


      .halo {

        width:
          220px;

        height:
          220px;
      }


      .orbit {

        width:
          215px;

        height:
          215px;
      }


      .construction {

        transform:
          scale(0.84);
      }


      .heartbeat {

        width:
          340px;

        height:
          82px;

        bottom:
          0;
      }


      h1 {

        font-size:
          44px;

        letter-spacing:
          -2.5px;
      }


      .description {

        font-size:
          14px;

        line-height:
          1.75;
      }


      .status {

        margin-top:
          22px;
      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>

</head>


<body>


  <!-- =======================================================
       PAGE
       ======================================================= -->

  <main class="page">


    <!-- =====================================================
         WELLENS LOGO
         ===================================================== -->

    <div class="brand">

      <img
        class="brand-logo"
        src="./wellens-logo.png"
        alt="Wellens"
      >

    </div>


    <!-- =====================================================
         CENTRAL VISUAL
         ===================================================== -->

    <div
      class="visual"
      id="visual"
    >


      <!-- Background glow -->

      <div class="halo"></div>


      <!-- Orbit -->

      <div class="orbit"></div>


      <!-- =================================================
           CONSTRUCTION SITE
           ================================================= -->

      <div class="construction">


        <!-- Ground -->

        <div class="ground"></div>


        <!-- Foundation -->

        <div class="foundation"></div>


        <!-- =================================================
             BUILDING
             ================================================= -->

        <div class="building">

  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>


    /* =====================================================
       CURRENT YEAR
       ===================================================== */

    document
      .getElementById("year")
      .textContent =
      new Date().getFullYear();


    /* =====================================================
       SUBTLE MOUSE MOVEMENT
       ===================================================== */

    const visual =
      document.getElementById("visual");


    /*
      Only use this effect when a real mouse
      is available.

      It gives the construction scene a
      very subtle sense of depth.
    */

    if (
      window.matchMedia(
        "(pointer:fine)"
      ).matches
    ) {


      document.addEventListener(
        "mousemove",
        function(event) {


          const x =
            event.clientX /
            window.innerWidth -
            0.5;


          const y =
            event.clientY /
            window.innerHeight -
            0.5;


          visual.style.transform =
            `translate(
              ${x * 4}px,
              ${y * 4}px
            )`;

        }
      );


      document.addEventListener(
        "mouseleave",
        function() {

          visual.style.transform =
            "translate(0, 0)";

        }
      );

    }

  </script>
