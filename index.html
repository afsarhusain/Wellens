<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wellens — Coming Soon</title>

  <style>
    :root {
      /* =====================================================
         WELLENS BRAND PALETTE
         ===================================================== */

      --primary-blue: #1769AA;
      --primary-dark: #125486;

      --teal: #0F9D8A;
      --light-teal: #E8F5F2;

      --background: #F7FAFC;
      --white: #FFFFFF;

      --text: #1F2937;
      --muted: #64748B;

      --border: #E2E8F0;

      --hero-blue: #DCEEF9;
      --hero-teal: #DFF5F1;

      --cta-blue: #0D82A1;

      --footer: #102A43;
      --footer-text: #B8C7D6;
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(220, 238, 249, 0.85),
          transparent 35%
        ),
        radial-gradient(
          circle at 15% 90%,
          rgba(223, 245, 241, 0.65),
          transparent 30%
        ),
        var(--background);

      overflow: hidden;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      min-height: 100vh;

      position: relative;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 40px 24px 70px;

      text-align: center;
    }


    /* =====================================================
       TOP BRAND
       ===================================================== */

    .brand {
      position: absolute;

      top: 28px;
      left: 42px;

      display: flex;
      align-items: center;

      animation:
        fadeDown 0.9s ease both;
    }


    /*
      The uploaded logo contains whitespace around the artwork.

      The image is placed inside this container using
      object-fit: contain.

      For the cleanest result, use a cropped version of the
      logo on the live website if available.
    */

    .brand-logo {
      width: 72px;
      height: 52px;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       CENTRAL VISUAL
       ===================================================== */

    .visual {
      width: 330px;
      height: 255px;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      transition:
        transform 0.15s ease-out;
    }


    /* Soft background glow */

    .halo {
      position: absolute;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(220, 238, 249, 0.95),
          rgba(223, 245, 241, 0.45) 58%,
          transparent 72%
        );

      animation:
        breathe 5s ease-in-out infinite;
    }


    /* =====================================================
       ROTATING ORBIT
       ===================================================== */

    .orbit {
      position: absolute;

      width: 210px;
      height: 210px;

      border-radius: 50%;

      border:
        1px solid rgba(23, 105, 170, 0.13);

      animation:
        rotate 20s linear infinite;
    }


    .orbit::before,
    .orbit::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;
    }


    .orbit::before {
      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      background: var(--primary-blue);
    }


    .orbit::after {
      right: 16px;
      bottom: 38px;

      background: var(--teal);
    }


    /* =====================================================
       CENTRAL BRAND SYMBOL
       ===================================================== */

    .symbol {
      width: 104px;
      height: 104px;

      position: relative;

      z-index: 2;

      border-radius: 30px;

      background: var(--white);

      border:
        1px solid rgba(23, 105, 170, 0.08);

      box-shadow:
        0 22px 50px rgba(23, 105, 170, 0.14);

      display: flex;
      align-items: center;
      justify-content: center;

      animation:
        appear 1.1s 0.35s ease both,
        float 5s 1.4s ease-in-out infinite;
    }


    /*
      The central mark is deliberately abstract.

      The real Wellens logo remains in the header.
      This central symbol represents the "website taking shape".
    */

    .symbol-inner {
      width: 54px;
      height: 54px;

      position: relative;
    }


    .symbol-inner::before,
    .symbol-inner::after {
      content: "";

      position: absolute;

      width: 35px;
      height: 35px;

      border:
        4px solid var(--primary-blue);

      border-radius: 50%;
    }


    .symbol-inner::before {
      left: 0;
      top: 10px;
    }


    .symbol-inner::after {
      right: 0;
      top: 10px;

      border-color: var(--primary-blue);
    }


    /* Teal heartbeat point */

    .pulse {
      position: absolute;

      width: 11px;
      height: 11px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: var(--teal);

      box-shadow:
        0 0 0 7px rgba(15, 157, 138, 0.09);

      animation:
        pulse 2s ease-in-out infinite;
    }


    /* =====================================================
       ECG LINE
       ===================================================== */

    .heartbeat {
      position: absolute;

      width: 330px;
      height: 82px;

      left: 50%;
      bottom: -3px;

      transform:
        translateX(-50%);

      overflow: hidden;

      opacity: 0.82;
    }


    .heartbeat svg {
      width: 100%;
      height: 100%;
    }


    .heartbeat-path {
      fill: none;

      stroke: var(--teal);

      stroke-width: 1.7;

      stroke-linecap: round;

      stroke-linejoin: round;

      stroke-dasharray: 440;

      stroke-dashoffset: 440;

      animation:
        heartbeatDraw 3.2s 1.1s ease forwards,
        heartbeatGlow 3.5s 4.3s ease-in-out infinite;
    }


    /* =====================================================
       TEXT
       ===================================================== */

    .eyebrow {
      margin-bottom: 16px;

      color: var(--primary-blue);

      font-size: 11px;

      font-weight: 750;

      letter-spacing: 2px;

      text-transform: uppercase;

      animation:
        fadeUp 0.9s 0.7s ease both;
    }


    h1 {
      font-size:
        clamp(44px, 6vw, 70px);

      line-height: 1;

      letter-spacing: -3.5px;

      font-weight: 650;

      color: var(--text);

      margin-bottom: 22px;

      animation:
        fadeUp 0.9s 0.85s ease both;
    }


    h1 span {
      color: var(--primary-blue);
    }


    .description {
      max-width: 500px;

      margin: 0 auto;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.8;

      animation:
        fadeUp 0.9s 1s ease both;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      margin-top: 28px;

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 9px 16px;

      border-radius: 100px;

      background: var(--light-teal);

      border:
        1px solid rgba(15, 157, 138, 0.12);

      color:
        #087967;

      font-size: 11px;

      font-weight: 650;

      animation:
        fadeUp 0.9s 1.15s ease both;
    }


    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--teal);

      animation:
        statusPulse 2s infinite;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: var(--footer);

      color: var(--footer-text);

      font-size: 10px;

      animation:
        fadeUp 1s 1.4s ease both;
    }


    /* =====================================================
       ANIMATIONS
       ===================================================== */

    @keyframes breathe {

      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.72;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }


    @keyframes rotate {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }


    @keyframes pulse {

      0%,
      100% {
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      50% {
        transform:
          translate(-50%, -50%)
          scale(1.18);
      }
    }


    @keyframes statusPulse {

      0%,
      100% {
        box-shadow:
          0 0 0 0
          rgba(15, 157, 138, 0.25);
      }

      50% {
        box-shadow:
          0 0 0 6px
          rgba(15, 157, 138, 0);
      }
    }


    @keyframes heartbeatDraw {

      to {
        stroke-dashoffset: 0;
      }
    }


    @keyframes heartbeatGlow {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.95;
      }
    }


    @keyframes appear {

      from {
        opacity: 0;
        transform: scale(0.72);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }


    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @keyframes fadeDown {

      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        overflow: auto;
      }


      .page {
        padding:
          80px 20px 70px;
      }


      .brand {
        top: 20px;
        left: 22px;
      }


      .brand-logo {
        width: 66px;
        height: 46px;
      }


      .visual {
        width: 290px;
        height: 225px;

        margin-bottom: 8px;
      }


      .halo {
        width: 190px;
        height: 190px;
      }


      .orbit {
        width: 180px;
        height: 180px;
      }


      .symbol {
        width: 92px;
        height: 92px;

        border-radius: 27px;
      }


      .heartbeat {
        width: 290px;
      }


      h1 {
        font-size: 44px;

        letter-spacing: -2.5px;
      }


      .description {
        font-size: 14px;
      }


      .status {
        margin-top: 23px;
      }

    }


    /* =====================================================
       ACCESSIBILITY
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =====================================================
         WELLENS LOGO
         ===================================================== -->

    <!--
      Put the uploaded "_Main symbol.png" in the same folder
      as this HTML file.

      For your production website, I recommend renaming it
      to something simple such as:

      wellens-logo.png
    -->

    <div class="brand">

      <img
        class="brand-logo"
        src="wellens-logo.png"
        alt="Wellens"
      />

    </div>


    <!-- =====================================================
         CENTRAL VISUAL
         ===================================================== -->

    <div class="visual" id="visual">

      <div class="halo"></div>

      <div class="orbit"></div>


      <div class="symbol">

        <div class="symbol-inner">

          <div class="pulse"></div>

        </div>

      </div>


      <!-- ECG -->

      <div class="heartbeat">

        <svg
          viewBox="0 0 330 82"
          preserveAspectRatio="none"
          aria-hidden="true"
        >

          <path
            class="heartbeat-path"
            d="
              M 0 43
              L 87 43
              L 99 43
              L 107 36
              L 115 50
              L 123 43
              L 141 43
              L 151 43
              L 160 18
              L 171 66
              L 183 43
              L 195 43
              L 207 43
              L 216 36
              L 224 50
              L 232 43
              L 330 43
            "
          />

        </svg>

      </div>

    </div>


    <!-- =====================================================
         MESSAGE
         ===================================================== -->

    <div class="eyebrow">

      Something good is taking shape

    </div>


    <h1>

      Wellens is<br>

      <span>coming soon.</span>

    </h1>


    <p class="description">

      We're putting the finishing touches on our website —
      a simpler way to discover the clinic, understand your
      care options and book an appointment.

    </p>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="status">

      <span class="status-dot"></span>

      Website in development

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">

      © <span id="year"></span>
      Wellens · Healthcare, made simpler.

    </div>

  </main>


  <script>

    /* =====================================================
       YEAR
       ===================================================== */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* =====================================================
       SUBTLE MOUSE PARALLAX
       ===================================================== */

    const visual =
      document.getElementById("visual");


    if (
      window.matchMedia("(pointer:fine)").matches
    ) {

      document.addEventListener(
        "mousemove",
        function (event) {

          const x =
            (event.clientX /
              window.innerWidth - 0.5);

          const y =
            (event.clientY /
              window.innerHeight - 0.5);


          visual.style.transform =
            `translate(
              ${x * 5}px,
              ${y * 5}px
            )`;

        }
      );

    }

  </script>

</body>
</html>
