<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wellens — Coming Soon</title>


  <style>

    /* =========================================================
       WELLENS — BRAND COLOURS
       ========================================================= */

    :root {

      --primary-blue: #1769AA;
      --primary-dark: #125486;

      --teal: #0F9D8A;
      --light-teal: #E8F5F2;

      --background: #F7FAFC;
      --white: #FFFFFF;

      --text: #1F2937;
      --muted: #64748B;

      --border: #E2E8F0;

      --hero-blue: #DCEEF9;
      --hero-teal: #DFF5F1;

      --cta-blue: #0D82A1;

      --footer: #102A43;
      --footer-text: #B8C7D6;

      /* ECG red */
      --ecg-red: #C62828;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 50% 38%,
          rgba(220, 238, 249, 0.90),
          transparent 35%
        ),

        radial-gradient(
          circle at 15% 90%,
          rgba(223, 245, 241, 0.70),
          transparent 30%
        ),

        var(--background);

      overflow: hidden;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .page {

      min-height: 100vh;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        50px 24px 70px;

      text-align: center;
    }


    /* =========================================================
       WELLENS LOGO
       ========================================================= */

    .brand {

      position: absolute;

      top: 25px;
      left: 38px;

      display: flex;

      align-items: center;

      animation:
        fadeDown 0.9s ease both;
    }


    .brand-logo {

      /*
        Slightly larger than before.
        Your actual uploaded logo is used here.
      */

      width: 110px;
      height: 72px;

      object-fit: contain;

      display: block;
    }


    /* =========================================================
       CENTRAL VISUAL
       ========================================================= */

    .visual {

      width: 330px;
      height: 255px;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 15px;

      transition:
        transform 0.15s ease-out;
    }


    /* =========================================================
       SOFT BACKGROUND HALO
       ========================================================= */

    .halo {

      position: absolute;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,

          rgba(220, 238, 249, 0.95),

          rgba(223, 245, 241, 0.48) 58%,

          transparent 72%
        );

      animation:
        breathe 5s ease-in-out infinite;
    }


    /* =========================================================
       ORBIT
       ========================================================= */

    .orbit {

      position: absolute;

      width: 210px;
      height: 210px;

      border-radius: 50%;

      border:
        1px solid
        rgba(23, 105, 170, 0.13);

      animation:
        rotate 20s linear infinite;
    }


    .orbit::before,
    .orbit::after {

      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;
    }


    .orbit::before {

      top: 18px;

      left: 50%;

      transform:
        translateX(-50%);

      background:
        var(--primary-blue);
    }


    .orbit::after {

      right: 16px;

      bottom: 38px;

      background:
        var(--teal);
    }


    /* =========================================================
       CONSTRUCTION SCENE
       ========================================================= */

    .construction {

      width: 190px;
      height: 175px;

      position: relative;

      z-index: 3;

      animation:
        constructionFloat 5s ease-in-out infinite;
    }


    /* =========================================================
       BUILDING
       ========================================================= */

    .building {

      position: absolute;

      left: 50%;
      bottom: 18px;

      width: 86px;
      height: 105px;

      transform:
        translateX(-50%);

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      gap: 5px;
    }


    /* Building floors */

    .floor {

      width: 100%;
      height: 29px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 6px;

      padding:
        5px 7px;

      background:

        linear-gradient(
          135deg,
          #FFFFFF,
          #EDF6FB
        );

      border:
        1px solid
        rgba(23, 105, 170, 0.16);

      border-radius: 4px;

      box-shadow:
        0 4px 9px
        rgba(23, 105, 170, 0.08);
    }


    /* Building windows */

    .floor span {

      display: block;

      border-radius: 2px;

      background:
        var(--hero-blue);

      border:
        1px solid
        rgba(23, 105, 170, 0.12);
    }


    /* Floors subtly animate */

    .floor-one {

      animation:
        buildFloor
        5s
        ease-in-out
        infinite;
    }


    .floor-two {

      animation:
        buildFloor
        5s
        0.45s
        ease-in-out
        infinite;
    }


    .floor-three {

      animation:
        buildFloor
        5s
        0.9s
        ease-in-out
        infinite;
    }


    /* =========================================================
       CRANE
       ========================================================= */

    .crane {

      position: absolute;

      left: 25px;
      top: 15px;

      width: 145px;
      height: 105px;
    }


    /* Crane mast */

    .crane-mast {

      position: absolute;

      left: 27px;
      top: 0;

      width: 5px;
      height: 115px;

      border-radius: 4px;

      background:
        var(--primary-blue);
    }


    /* Crane horizontal arm */

    .crane-arm {

      position: absolute;

      left: 27px;
      top: 2px;

      width: 125px;
      height: 5px;

      border-radius: 4px;

      background:
        var(--primary-blue);

      transform-origin:
        left center;

      animation:
        craneMove
        5s
        ease-in-out
        infinite;
    }


    /* Cable */

    .crane-cable {

      position: absolute;

      right: 19px;
      top: 5px;

      width: 2px;
      height: 55px;

      background:
        var(--muted);

      transform-origin:
        top center;

      animation:
        cableMove
        5s
        ease-in-out
        infinite;
    }


    /* Hook */

    .crane-hook {

      position: absolute;

      right: 14px;
      top: 57px;

      width: 12px;
      height: 12px;

      border:
        2px solid
        var(--primary-blue);

      border-top: none;

      border-radius:
        0 0 8px 8px;

      animation:
        hookMove
        5s
        ease-in-out
        infinite;
    }


    /* =========================================================
       BUILDING BLOCK
       ========================================================= */

    .building-block {

      position: absolute;

      width: 18px;
      height: 18px;

      right: 38px;
      top: 68px;

      border-radius: 3px;

      background:
        var(--teal);

      box-shadow:
        0 5px 12px
        rgba(15, 157, 138, 0.22);

      animation:
        blockMove
        5s
        ease-in-out
        infinite;
    }


    /* =========================================================
       ECG HEARTBEAT
       ========================================================= */

    .heartbeat {

      position: absolute;

      width: 330px;
      height: 82px;

      left: 50%;

      bottom: -3px;

      transform:
        translateX(-50%);

      overflow: hidden;

      opacity: 0.88;

      z-index: 5;

      pointer-events: none;
    }


    .heartbeat svg {

      width: 100%;
      height: 100%;
    }


    .heartbeat-path {

      fill: none;

      /*
        RED ECG
      */

      stroke:
        var(--ecg-red);

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;

      /*
        Creates the travelling pulse effect
      */

      stroke-dasharray:
        18 12 7 12 18 420;

      stroke-dashoffset:
        470;

      animation:
        heartbeatTravel
        3.2s
        linear
        infinite;
    }


    /* =========================================================
       TEXT
       ========================================================= */

    .eyebrow {

      margin-bottom: 16px;

      color:
        var(--primary-blue);

      font-size: 11px;

      font-weight: 750;

      letter-spacing: 2px;

      text-transform: uppercase;

      animation:
        fadeUp
        0.9s
        0.7s
        ease
        both;
    }


    h1 {

      font-size:
        clamp(44px, 6vw, 70px);

      line-height: 1;

      letter-spacing: -3.5px;

      font-weight: 650;

      color:
        var(--text);

      margin-bottom: 22px;

      animation:
        fadeUp
        0.9s
        0.85s
        ease
        both;
    }


    h1 span {

      color:
        var(--primary-blue);
    }


    .description {

      max-width: 500px;

      margin:
        0 auto;

      color:
        var(--muted);

      font-size: 15px;

      line-height: 1.8;

      animation:
        fadeUp
        0.9s
        1s
        ease
        both;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {

      margin-top: 28px;

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding:
        9px 16px;

      border-radius: 100px;

      background:
        var(--light-teal);

      border:
        1px solid
        rgba(15, 157, 138, 0.12);

      color:
        #087967;

      font-size: 11px;

      font-weight: 650;

      animation:
        fadeUp
        0.9s
        1.15s
        ease
        both;
    }


    .status-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--teal);

      animation:
        statusPulse
        2s
        infinite;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      position: absolute;

      bottom: 0;

      left: 0;
      right: 0;

      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        var(--footer);

      color:
        var(--footer-text);

      font-size: 10px;

      animation:
        fadeUp
        1s
        1.4s
        ease
        both;
    }


    /* =========================================================
       ANIMATIONS
       ========================================================= */


    /* Background halo */

    @keyframes breathe {

      0%,
      100% {

        transform:
          scale(0.96);

        opacity:
          0.72;
      }

      50% {

        transform:
          scale(1.05);

        opacity:
          1;
      }
    }


    /* Orbit */

    @keyframes rotate {

      from {

        transform:
          rotate(0deg);
      }

      to {

        transform:
          rotate(360deg);
      }
    }


    /* Construction scene floating */

    @keyframes constructionFloat {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-7px);
      }
    }


    /* Crane movement */

    @keyframes craneMove {

      0%,
      100% {

        transform:
          rotate(0deg);
      }

      50% {

        transform:
          rotate(-3deg);
      }
    }


    /* Cable movement */

    @keyframes cableMove {

      0%,
      100% {

        height:
          55px;
      }

      50% {

        height:
          63px;
      }
    }


    /* Hook movement */

    @keyframes hookMove {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(8px);
      }
    }


    /*
      Building block travels from the crane
      toward the building and resets.
    */

    @keyframes blockMove {

      0% {

        transform:
          translate(0, 0);

        opacity:
          0;
      }

      12% {

        opacity:
          1;
      }

      35% {

        transform:
          translate(0, -25px);
      }

      55% {

        transform:
          translate(-40px, -25px);
      }

      70% {

        transform:
          translate(-40px, 15px);
      }

      78% {

        transform:
          translate(-40px, 15px);

        opacity:
          1;
      }

      88%,
      100% {

        transform:
          translate(0, 0);

        opacity:
          0;
      }
    }


    /* Building floors */

    @keyframes buildFloor {

      0%,
      20% {

        opacity:
          0.35;

        transform:
          translateY(5px);
      }

      35%,
      85% {

        opacity:
          1;

        transform:
          translateY(0);
      }

      100% {

        opacity:
          0.35;
      }
    }


    /*
      ECG continuously travels across the screen.
    */

    @keyframes heartbeatTravel {

      0% {

        stroke-dashoffset:
          470;

        opacity:
          0.55;
      }

      10% {

        opacity:
          0.9;
      }

      50% {

        opacity:
          1;
      }

      90% {

        opacity:
          0.9;
      }

      100% {

        stroke-dashoffset:
          0;

        opacity:
          0.55;
      }
    }


    /* Centre pulse */

    @keyframes pulse {

      0%,
      100% {

        transform:
          translate(-50%, -50%)
          scale(1);
      }

      50% {

        transform:
          translate(-50%, -50%)
          scale(1.18);
      }
    }


    /* Status indicator */

    @keyframes statusPulse {

      0%,
      100% {

        box-shadow:
          0 0 0 0
          rgba(15, 157, 138, 0.25);
      }

      50% {

        box-shadow:
          0 0 0 6px
          rgba(15, 157, 138, 0);
      }
    }


    /* Fade animations */

    @keyframes fadeUp {

      from {

        opacity:
          0;

        transform:
          translateY(15px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    @keyframes fadeDown {

      from {

        opacity:
          0;

        transform:
          translateY(-12px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      body {

        overflow:
          auto;
      }


      .page {

        padding:
          85px 20px 70px;
      }


      .brand {

        top:
          18px;

        left:
          20px;
      }


      .brand-logo {

        width:
          90px;

        height:
          60px;
      }


      .visual {

        width:
          290px;

        height:
          225px;

        margin-bottom:
          8px;
      }


      .halo {

        width:
          190px;

        height:
          190px;
      }


      .orbit {

        width:
          180px;

        height:
          180px;
      }


      .construction {

        transform:
          scale(0.92);
      }


      .heartbeat {

        width:
          290px;
      }


      h1 {

        font-size:
          44px;

        letter-spacing:
          -2.5px;
      }


      .description {

        font-size:
          14px;
      }


      .status {

        margin-top:
          23px;
      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>

</head>


<body>


  <!-- =======================================================
       MAIN PAGE
       ======================================================= -->

  <main class="page">


    <!-- =====================================================
         WELLENS LOGO
         ===================================================== -->

    <div class="brand">

      <img
        class="brand-logo"
        src="./wellens-logo.png"
        alt="Wellens"
      >

    </div>


    <!-- =====================================================
         CENTRAL ANIMATION
         ===================================================== -->

    <div
      class="visual"
      id="visual"
    >


      <!-- Soft glow -->

      <div class="halo"></div>


      <!-- Rotating orbit -->

      <div class="orbit"></div>


      <!-- =================================================
           CONSTRUCTION
           ================================================= -->

      <div class="construction">


        <!-- Crane -->

        <div class="crane">

          <div class="crane-mast"></div>

          <div class="crane-arm">

            <div class="crane-cable"></div>

            <div class="crane-hook"></div>

          </div>

        </div>


        <!-- Building -->

        <div class="building">


          <div class="floor floor-one">

            <span></span>
            <span></span>
            <span></span>

          </div>


          <div class="floor floor-two">

            <span></span>
            <span></span>
            <span></span>

          </div>


          <div class="floor floor-three">

            <span></span>
            <span></span>
            <span></span>

          </div>


        </div>


        <!-- Block being moved -->

        <div class="building-block"></div>


      </div>


      <!-- =================================================
           ANIMATED ECG
           ================================================= -->

      <div class="heartbeat">

        <svg
          viewBox="0 0 330 82"
          preserveAspectRatio="none"
          aria-hidden="true"
        >

          <path
            class="heartbeat-path"
            d="
              M 0 43
              L 87 43

              L 99 43
              L 107 36
              L 115 50
              L 123 43

              L 141 43
              L 151 43

              L 160 18
              L 171 66
              L 183 43

              L 195 43
              L 207 43
              L 216 36
              L 224 50
              L 232 43

              L 330 43
            "
          ></path>

        </svg>

      </div>


    </div>


    <!-- =====================================================
         HEADLINE
         ===================================================== -->

    <div class="eyebrow">

      Something good is taking shape

    </div>


    <h1>

      Wellens is<br>

      <span>coming soon.</span>

    </h1>


    <!-- =====================================================
         DESCRIPTION
         ===================================================== -->

    <p class="description">

      We're putting the finishing touches on our website —
      a simpler way to discover the clinic, understand your
      care options and book an appointment.

    </p>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="status">

      <span class="status-dot"></span>

      Website in development

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">

      © <span id="year"></span>
      Wellens · Healthcare, made simpler.

    </div>


  </main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>


    /* =====================================================
       CURRENT YEAR
       ===================================================== */

    document
      .getElementById("year")
      .textContent =
      new Date().getFullYear();



    /* =====================================================
       SUBTLE MOUSE PARALLAX
       ===================================================== */

    const visual =
      document.getElementById("visual");


    /*
      Only activate on devices with
      a real mouse/pointer.
    */

    if (
      window.matchMedia(
        "(pointer:fine)"
      ).matches
    ) {


      document.addEventListener(
        "mousemove",
        function (event) {


          const x =
            event.clientX /
            window.innerWidth -
            0.5;


          const y =
            event.clientY /
            window.innerHeight -
            0.5;


          visual.style.transform =
            `translate(
              ${x * 5}px,
              ${y * 5}px
            )`;

        }
      );


      /*
        Return to centre when
        mouse leaves the page.
      */

      document.addEventListener(
        "mouseleave",
        function () {

          visual.style.transform =
            "translate(0, 0)";

        }
      );

    }


  </script>


</body>
</html>
